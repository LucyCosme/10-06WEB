<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>css</title>
</head>
<body class="bg-green-300">
    <h1 class="text-red-500">hola mundo, estoy usando tailwindcss</h1>
    <div class="h-14 bg-gradient-to-r from-violet-500 to-fuchsia-500">
        <h2 class="text-blue-200">tailind por: lucy cosme</h2>
    </div>
    <div class="h-14 bg-gradient-to-r from-purple-500 to-pink-500">
        <p class="font-sans  hover:font-serif">Lorem ipsum s velit ex quam illum consequuntur exercitationem aspernatur excepturi enim, alias perspiciatis iste minus quis placeat deserunt.</p>
    </div>
    <!-- ********************-->
    <div class="container columns-3">
        <div class="rounded-full w-48 h-48">
            <img src="imags\images.jpg " class="rounded-full opacity-50">
        </div>
        <div class="rounded-full w-48 h-48">
            <img src="imags\images.jpg " class="rounded-full blur-sm">
        </div>
        <div class="rounded-full w-48 h-48">
            <img src="imags\images.jpg " class="rounded-full grayscale">
        </div>
    </div>

    <div class="container columns-3">
        <div class="">
            <img src="imags\images.jpg " class="rounded-lg sature-200">
        </div>
        <div class="rounded-md">
            <img src="imags\images.jpg " class="rounded-lg invert sepia" >
        </div>
        <div class="rounded-lg">
            <img src="imags\images.jpg " class="rounded-lg hue-rotate-90">
        </div>
    </div>
    <!-- ********************-->
</body>
